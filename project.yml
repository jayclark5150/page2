name: Page2
options:
  bundleIdPrefix: com.jayclark
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Page2:
    type: application
    # One multiplatform target that builds for Mac, iPad, and iPhone.
    supportedDestinations: [macOS, iOS]
    sources:
      - Page2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jayclark.page2
        PRODUCT_NAME: Page2
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Page 2
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        # iOS needs a generated launch screen and sensible orientations.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Entitlements only apply to the macOS sandbox build.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Page2/Page2.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # macOS: ad-hoc signing so it builds and distributes with no paid account.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # iOS device: automatic signing with the personal (free) team, so Xcode
        # creates and renews the provisioning profile. Simulator needs no signing.
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": "TCDZ22XX74"
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "6"
  Page2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Page2Tests
    dependencies:
      - target: Page2
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jayclark.page2.tests
        SWIFT_VERSION: "5.0"
        # The app is multiplatform, so point the host at the macOS bundle layout.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Page2.app/Contents/MacOS/Page2"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Page2:
    build:
      targets:
        Page2: all
        Page2Tests: [test]
    test:
      targets:
        - Page2Tests
